name: Deploy a EC2

# Se dispara al hacer push a main (después de que CI pase) o a mano.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  ECR_REGISTRY: 012875038716.dkr.ecr.sa-east-1.amazonaws.com
  # Rol que GitHub asume por OIDC. No es un secreto: su política de confianza
  # solo acepta tokens de ESTE repositorio, así que a nadie más le sirve.
  AWS_ROLE: arn:aws:iam::012875038716:role/zoonosis-github-actions
  INSTANCE_ID: i-0bf849ad18133ed10
  PUBLIC_HOST: 18.229.213.106

jobs:
  build-and-push:
    name: Construir y publicar imágenes en ECR
    runs-on: ubuntu-latest
    # Solo si el CI terminó bien (o si se lanzó a mano).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      # Necesario para pedir el token OIDC con el que se asume el rol de AWS.
      id-token: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # El ARN va literal, no por ${{ env.* }}: el contexto `env` tiene reglas
      # de disponibilidad distintas según dónde se use, y acá no vale arriesgar
      # que llegue vacío y el fallo parezca un problema de permisos.
      - name: Asumir el rol de AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012875038716:role/zoonosis-github-actions
          aws-region: sa-east-1

      - name: Autenticarse en ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calcular etiqueta
        id: meta
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/zoonosis-backend:${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/zoonosis-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Publicar imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/zoonosis-frontend:${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/zoonosis-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

  deploy:
    name: Desplegar en la instancia EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: produccion
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Asumir el rol de AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012875038716:role/zoonosis-github-actions
          aws-region: sa-east-1

      # El despliegue va por AWS Systems Manager, no por SSH. Así no hay que
      # guardar la clave privada de la instancia en los secretos del
      # repositorio: el permiso vive en el rol y solo alcanza a esta instancia.
      - name: Disparar el redespliegue por SSM
        id: ssm
        env:
          SHA: ${{ needs.build-and-push.outputs.sha }}
          # Rama a desplegar: la que pasó el CI, o la elegida al lanzarlo a mano.
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          # Clave del asistente virtual. Si el secreto no existe, el .env del
          # servidor conserva la que tenga.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # Variables que se sincronizan en el .env de la instancia. Los datos de
          # contacto son públicos; la clave llega cifrada desde los secretos.
          {
            echo 'upsert() { sed -i "/^$1=/d" .env; printf "%s=%s\n" "$1" "$2" >> .env; }'
            echo "upsert INSTITUTION_NAME '\"Adopet\"'"
            echo "upsert INSTITUTION_SHORT_NAME '\"Adopet\"'"
            echo "upsert INSTITUTION_PHONE '\"+591 67871058\"'"
            echo "upsert INSTITUTION_EMAIL 'torricojulioc@gmail.com'"
            echo "upsert CONTACT_TO 'torricojulioc@gmail.com'"
            echo "upsert SOCIAL_FACEBOOK 'https://www.facebook.com/adopet.bo'"
            echo "upsert SOCIAL_INSTAGRAM 'https://www.instagram.com/adopetsantacruz/'"
            echo "upsert SOCIAL_TIKTOK 'https://www.tiktok.com/@adopetsantacruz'"
            echo "upsert SOCIAL_WHATSAPP 'https://wa.me/59167871058'"
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              echo "upsert ANTHROPIC_API_KEY '$ANTHROPIC_API_KEY'"
            fi
          } > sync-env.sh
          SYNC_B64=$(base64 -w0 sync-env.sh)
          rm -f sync-env.sh
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Despliegue $SHA desde GitHub Actions" \
            --timeout-seconds 900 \
            --parameters commands="[
              \"set -eu\",
              \"cd /opt/zoonosis\",
              \"git fetch --all --quiet\",
              \"git reset --hard origin/${BRANCH} --quiet\",
              \"sed -i 's|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${ECR_REGISTRY}/zoonosis-backend:${SHA}|' .env\",
              \"sed -i 's|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${ECR_REGISTRY}/zoonosis-frontend:${SHA}|' .env\",
              \"echo ${SYNC_B64} | base64 -d | bash\",
              \"chmod +x deploy/redeploy.sh\",
              \"./deploy/redeploy.sh\"
            ]" \
            --query 'Command.CommandId' --output text)
          echo "comando: $CMD_ID"
          echo "id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Esperar el resultado
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            sleep 10
            EST=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.id }}" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text)
            echo "[$i] estado: $EST"
            case "$EST" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::El redespliegue terminó en $EST"
                aws ssm get-command-invocation \
                  --command-id "${{ steps.ssm.outputs.id }}" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text
                exit 1 ;;
            esac
            if [ "$i" -eq 60 ]; then
              echo "::error::Se agotó la espera de 10 minutos"
              exit 1
            fi
          done
          echo "--- salida del despliegue ---"
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.id }}" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text | tail -30

      - name: Verificar el sitio público
        run: |
          for i in $(seq 1 10); do
            if curl -fsSk "https://$PUBLIC_HOST/api/v1/health" || curl -fsS "http://$PUBLIC_HOST/api/v1/health"; then
              echo
              echo "$PUBLIC_HOST responde correctamente"
              exit 0
            fi
            sleep 6
          done
          echo "::error::El sitio no respondió tras el despliegue"
          exit 1
