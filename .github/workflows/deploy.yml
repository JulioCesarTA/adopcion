name: Deploy a EC2

# Se dispara al hacer push a main (después de que CI pase) o a mano.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build-and-push:
    name: Construir y publicar imágenes en GHCR
    runs-on: ubuntu-latest
    # Solo si el CI terminó bien (o si se lanzó a mano).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.meta.outputs.backend }}
      frontend-image: ${{ steps.meta.outputs.frontend }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Autenticarse en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular etiquetas
        id: meta
        run: |
          BASE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}
          echo "backend=$BASE-backend:$SHA"   >> "$GITHUB_OUTPUT"
          echo "frontend=$BASE-frontend:$SHA" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"

      - name: Publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}-backend:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.base }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}-frontend:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.base }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en la instancia EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: produccion

    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.EC2_APP_DIR }}

            echo "==> Trayendo el código más reciente"
            git fetch --all
            git reset --hard origin/main

            echo "==> Autenticando en GHCR"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            echo "==> Fijando las imágenes de esta versión"
            # Reemplaza las dos líneas de imagen en .env sin tocar el resto.
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend-image }}|"   .env
            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${{ needs.build-and-push.outputs.frontend-image }}|" .env

            echo "==> Descargando imágenes"
            docker compose -f docker-compose.prod.yml pull backend frontend

            echo "==> Aplicando (las migraciones corren en el entrypoint del backend)"
            docker compose -f docker-compose.prod.yml up -d --no-build

            echo "==> Esperando que el API responda"
            ok=0
            for i in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T backend \
                   node -e "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                echo "API saludable"
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "El API no respondió tras 150 s; últimos logs:" >&2
              docker compose -f docker-compose.prod.yml logs --tail 80 backend >&2
              exit 1
            fi

            echo "==> Limpiando imágenes antiguas"
            docker image prune -f

            echo "Despliegue terminado"

      - name: Verificar el sitio público
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ secrets.DOMAIN }}/api/v1/health" >/dev/null; then
              echo "https://${{ secrets.DOMAIN }} responde correctamente"
              exit 0
            fi
            sleep 6
          done
          echo "El sitio no respondió tras el despliegue" >&2
          exit 1
