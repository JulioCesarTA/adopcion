name: Deploy a EC2

# Despliegue rápido: en cada push a main se construye y despliega directamente
# en la instancia, sin esperar al CI ni pasar por ECR. El CI sigue corriendo
# en paralelo como aviso.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  INSTANCE_ID: i-0bf849ad18133ed10
  PUBLIC_HOST: 18.229.213.106

jobs:
  deploy:
    name: Construir y desplegar en la instancia EC2
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      contents: read
      # Necesario para pedir el token OIDC con el que se asume el rol de AWS.
      id-token: write

    steps:
      # El ARN va literal: el contexto `env` no siempre está disponible acá.
      - name: Asumir el rol de AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::012875038716:role/zoonosis-github-actions
          aws-region: sa-east-1

      # El despliegue va por AWS Systems Manager, no por SSH: no hay que guardar
      # la clave privada de la instancia en los secretos del repositorio.
      - name: Disparar el despliegue por SSM
        id: ssm
        env:
          BRANCH: ${{ github.ref_name }}
          # Clave del asistente virtual. Si el secreto no existe, el .env del
          # servidor conserva la que tenga.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # Variables que se sincronizan en el .env de la instancia. Los datos de
          # contacto son públicos; la clave llega cifrada desde los secretos.
          {
            echo 'upsert() { sed -i "/^$1=/d" .env; printf "%s=%s\n" "$1" "$2" >> .env; }'
            echo "upsert INSTITUTION_NAME '\"Adopet\"'"
            echo "upsert INSTITUTION_SHORT_NAME '\"Adopet\"'"
            echo "upsert INSTITUTION_PHONE '\"+591 67871058\"'"
            echo "upsert INSTITUTION_EMAIL 'torricojulioc@gmail.com'"
            echo "upsert CONTACT_TO ''"
            echo "upsert SOCIAL_FACEBOOK 'https://www.facebook.com/adopet.bo'"
            echo "upsert SOCIAL_INSTAGRAM 'https://www.instagram.com/adopetsantacruz/'"
            echo "upsert SOCIAL_TIKTOK 'https://www.tiktok.com/@adopetsantacruz'"
            echo "upsert SOCIAL_WHATSAPP 'https://wa.me/59167871058'"
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              echo "upsert ANTHROPIC_API_KEY '$ANTHROPIC_API_KEY'"
            fi
          } > sync-env.sh
          SYNC_B64=$(base64 -w0 sync-env.sh)
          rm -f sync-env.sh
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Despliegue ${GITHUB_SHA::7} desde GitHub Actions" \
            --timeout-seconds 1200 \
            --parameters commands="[
              \"set -eu\",
              \"cd /opt/zoonosis\",
              \"git fetch --all --quiet\",
              \"git reset --hard origin/${BRANCH} --quiet\",
              \"echo ${SYNC_B64} | base64 -d | bash\",
              \"chmod +x deploy/build-deploy.sh\",
              \"BRANCH=${BRANCH} ./deploy/build-deploy.sh\"
            ]" \
            --query 'Command.CommandId' --output text)
          echo "comando: $CMD_ID"
          echo "id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Esperar el resultado
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            sleep 5
            EST=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.id }}" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            echo "[$i] estado: $EST"
            case "$EST" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::El despliegue terminó en $EST"
                aws ssm get-command-invocation \
                  --command-id "${{ steps.ssm.outputs.id }}" \
                  --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -60
                exit 1 ;;
            esac
            if [ "$i" -eq 120 ]; then
              echo "::error::Se agotó la espera de 10 minutos"
              exit 1
            fi
          done
          echo "--- salida del despliegue ---"
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.id }}" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text | tail -20

      - name: Verificar el sitio público
        run: |
          for i in $(seq 1 10); do
            if curl -fsSk "https://$PUBLIC_HOST/api/v1/health" || curl -fsS "http://$PUBLIC_HOST/api/v1/health"; then
              echo
              echo "$PUBLIC_HOST responde correctamente"
              exit 0
            fi
            sleep 6
          done
          echo "::error::El sitio no respondió tras el despliegue"
          exit 1
