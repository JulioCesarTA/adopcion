name: Deploy a EC2

# Se dispara al hacer push a main (después de que CI pase) o a mano.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  ECR_REGISTRY: 006419716393.dkr.ecr.sa-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Construir y publicar imágenes en ECR
    runs-on: ubuntu-latest
    # Solo si el CI terminó bien (o si se lanzó a mano).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      # Necesario para pedir el token OIDC con el que se asume el rol de AWS.
      # Así no hay claves de AWS guardadas en los secrets del repositorio.
      id-token: write
    outputs:
      backend-image: ${{ steps.meta.outputs.backend }}
      frontend-image: ${{ steps.meta.outputs.frontend }}

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Asumir el rol de AWS por OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Autenticarse en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Calcular etiquetas
        id: meta
        run: |
          SHA=${GITHUB_SHA::7}
          echo "backend=${{ env.ECR_REGISTRY }}/zoonosis-backend:$SHA"   >> "$GITHUB_OUTPUT"
          echo "frontend=${{ env.ECR_REGISTRY }}/zoonosis-frontend:$SHA" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/zoonosis-backend:${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/zoonosis-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publicar imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/zoonosis-frontend:${{ steps.meta.outputs.sha }}
            ${{ env.ECR_REGISTRY }}/zoonosis-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en la instancia EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: produccion

    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/zoonosis

            echo "==> Trayendo los archivos de despliegue más recientes"
            # Solo compose, plantillas de nginx y scripts. El .env no está en
            # el repositorio y `git reset` no lo toca porque está ignorado.
            sudo git fetch --all
            sudo git reset --hard origin/main

            echo "==> Fijando las imágenes de esta versión"
            sudo sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${{ needs.build-and-push.outputs.backend-image }}|"   .env
            sudo sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${{ needs.build-and-push.outputs.frontend-image }}|" .env

            echo "==> Redespliegue"
            # redeploy.sh elige solo el override (HTTP o HTTPS según si hay
            # certificado), inicia sesión en ECR con el rol de la instancia,
            # descarga, recrea y espera a que el API responda.
            # Las migraciones corren en el entrypoint del backend.
            sudo ./deploy/redeploy.sh

      - name: Verificar el sitio público
        run: |
          # PUBLIC_HOST es la IP elástica mientras no haya dominio.
          HOST="${{ secrets.PUBLIC_HOST }}"
          for i in $(seq 1 10); do
            if curl -fsS "https://$HOST/api/v1/health" >/dev/null; then
              echo "https://$HOST responde correctamente"
              exit 0
            fi
            sleep 6
          done
          echo "El sitio no respondió tras el despliegue" >&2
          exit 1
