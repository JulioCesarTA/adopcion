name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, tipos, pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zoonosis
          POSTGRES_PASSWORD: zoonosis
          POSTGRES_DB: zoonosis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zoonosis -d zoonosis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://zoonosis:zoonosis@localhost:5432/zoonosis_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-no-usar-en-produccion
      JWT_REFRESH_SECRET: ci-refresh-secret-no-usar-en-produccion
      FRONTEND_URL: http://localhost:3000
      STORAGE_DRIVER: local
      UPLOAD_DIR: /tmp/zoonosis-uploads

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      - name: Pruebas unitarias
        run: npm test

      - name: Migraciones y seed en la BD de pruebas
        run: npm run db:setup

      - name: Pruebas e2e
        run: npm run test:e2e

  frontend:
    name: Frontend — lint, tipos, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    name: Construir imágenes Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: zoonosis-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: zoonosis-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
