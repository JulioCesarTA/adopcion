# Sistema completo en local, lo más parecido a producción:
# - las imágenes se construyen con los Dockerfile del repositorio (sin cambios);
# - nginx usa la plantilla HTTP de deploy/nginx/templates-http (la misma de docker-compose.ec2.yml);
# - la base es la de prueba (contenedor zoonosis-db-test, puerto 5433, zoonosis_test).
#
# No contiene secretos: los valores salen de .env.test al ejecutar test/cap9/sistema.sh.
name: zoonosis-cap9

services:
  backend:
    image: zoonosis-backend:cap9
    build:
      context: ../../backend
    environment:
      DATABASE_URL: ${CAP9_DATABASE_URL:?ejecuta test/cap9/sistema.sh}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"

  # Segunda instancia, solo para el escaneo autenticado de ZAP (perfil «zap»): la misma imagen
  # y la misma base, con el token de acceso de 1 hora para que no venza en mitad del escaneo.
  backend-zap:
    image: zoonosis-backend:cap9
    profiles: ["zap"]
    environment:
      DATABASE_URL: ${CAP9_DATABASE_URL:?ejecuta test/cap9/sistema.sh}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL_SECONDS: 3600
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4100:4000"

  frontend:
    image: zoonosis-frontend:cap9
    build:
      context: ../../frontend
    depends_on: [backend]
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://backend:4000

  nginx:
    image: nginx:1.29-alpine
    depends_on: [frontend, backend]
    environment:
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ../../deploy/nginx/templates-http:/etc/nginx/templates:ro
      # Solo en local: anula el default.conf de la imagen (ver el comentario del archivo).
      - ./nginx-default-vacio.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:80"
